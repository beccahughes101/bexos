name: Bazel CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  firmware:
    name: Prepare firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    outputs:
      e2e-matrix: ${{ steps.e2e-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-role: firmware
      - name: Validate workflow and CI utilities
        run: bazel test //tools/ci:tests
      - name: Generate branch E2E matrix
        if: ${{ github.event_name != 'pull_request' }}
        id: e2e-matrix
        run: python3 tools/ci/e2e_matrix.py --github-output "$GITHUB_OUTPUT"
      - name: Refresh saved firmware
        run: bash tools/ci/firmware.sh
      - name: Upload firmware for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware
          path: ${{ runner.temp }}/bexos-firmware.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Clean up guest processes
        if: always()
        run: bash tools/ci/cleanup.sh
      - name: Collect diagnostics
        if: always()
        run: python3 tools/ci/collect.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diagnostics-firmware
          path: ${{ runner.temp }}/bexos-ci-diagnostics
          retention-days: 7

  build-test:
    name: Build and test (${{ matrix.architecture }})
    needs: firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        architecture: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-role: build-test-${{ matrix.architecture }}
        id: setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware
          path: ${{ runner.temp }}
      - name: Restore this run's firmware
        run: tar -xf "$RUNNER_TEMP/bexos-firmware.tar"
      - name: Select PR targets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/ci/affected_targets.py --base "$PR_BASE_SHA" \
            --build-output "$RUNNER_TEMP/bexos-build-targets" \
            --test-output "$RUNNER_TEMP/bexos-test-targets"
      - name: Build affected PR targets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GUEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [[ -s "$RUNNER_TEMP/bexos-build-targets" ]]; then
            bazel build -c opt --config="$GUEST_ARCHITECTURE" \
              --target_pattern_file="$RUNNER_TEMP/bexos-build-targets" \
              2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/build.log"
          else
            echo 'No Bazel build targets are affected by this pull request.'
          fi
      - name: Test affected PR targets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GUEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [[ -s "$RUNNER_TEMP/bexos-test-targets" ]]; then
            bazel test -c opt --config="$GUEST_ARCHITECTURE" --build_tests_only \
              --target_pattern_file="$RUNNER_TEMP/bexos-test-targets" \
              2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/test.log"
          else
            echo 'No non-E2E Bazel tests are affected by this pull request.'
          fi
      - name: Build repository
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GUEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          bazel build -c opt --config="$GUEST_ARCHITECTURE" //... \
            2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/build.log"
      - name: Run host tests
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GUEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          bazel test -c opt --config="$GUEST_ARCHITECTURE" --build_tests_only //... \
            2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/test.log"
      - name: Check E2E inventory
        if: ${{ !cancelled() && matrix.architecture == 'aarch64' && steps.setup.outcome == 'success' }}
        run: bazel run //testing/e2e/qemu:check_matrix
      - name: Check Rust formatting
        if: ${{ !cancelled() && matrix.architecture == 'aarch64' && steps.setup.outcome == 'success' }}
        run: |
          bazel run @rules_rust//:rustfmt
          git diff --exit-code
      - name: Save this run's build cache
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-disk
          key: bexos-ci-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
      - name: Clean up guest processes
        if: always()
        run: bash tools/ci/cleanup.sh
      - name: Collect diagnostics
        if: always()
        run: python3 tools/ci/collect.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diagnostics-build-test-${{ matrix.architecture }}
          path: ${{ runner.temp }}/bexos-ci-diagnostics
          retention-days: 7

  e2e:
    name: E2E ${{ matrix.id }} (${{ matrix.label }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [firmware, build-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.firmware.outputs.e2e-matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-role: e2e
          enable-disk-cache: 'false'
      - name: Restore this run's build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-disk
          key: bexos-ci-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware
          path: ${{ runner.temp }}
      - name: Restore this run's firmware
        run: tar -xf "$RUNNER_TEMP/bexos-firmware.tar"
      - name: Verify cached E2E target
        env:
          E2E_ARCHITECTURE: ${{ matrix.architecture }}
          E2E_ID: ${{ matrix.id }}
          E2E_LABEL: ${{ matrix.label }}
        run: |
          bazel build --config=e2e --config="$E2E_ARCHITECTURE" \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --execution_log_json_file="$RUNNER_TEMP/bexos-ci-logs/e2e-$E2E_ID-execution.json" \
            "$E2E_LABEL" 2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/e2e-preflight.log"
          python3 tools/ci/verify_cache.py \
            "$RUNNER_TEMP/bexos-ci-logs/e2e-$E2E_ID-execution.json"
      - name: Run cached E2E target
        env:
          E2E_ARCHITECTURE: ${{ matrix.architecture }}
          E2E_ID: ${{ matrix.id }}
          E2E_LABEL: ${{ matrix.label }}
        run: |
          bazel test --config=e2e --config="$E2E_ARCHITECTURE" \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --strategy=TestRunner=local \
            --nocache_test_results --test_env=BEXOS_QEMU_LIVE_LOG=1 \
            --profile="$RUNNER_TEMP/bexos-ci-logs/e2e-$E2E_ID.profile.gz" \
            "$E2E_LABEL" 2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/e2e.log"
      - name: Clean up guest processes
        if: always()
        run: bash tools/ci/cleanup.sh
      - name: Collect diagnostics
        if: always()
        run: python3 tools/ci/collect.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diagnostics-e2e-${{ matrix.id }}
          path: ${{ runner.temp }}/bexos-ci-diagnostics
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [firmware, build-test, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          printf 'Firmware: %s\nBuild/tests: %s\nE2E: %s\n' \
            "$FIRMWARE_RESULT" "$BUILD_TEST_RESULT" "$E2E_RESULT"
          [[ "$FIRMWARE_RESULT" == success && "$BUILD_TEST_RESULT" == success ]]
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$E2E_RESULT" == skipped ]]
          else
            [[ "$E2E_RESULT" == success ]]
          fi
