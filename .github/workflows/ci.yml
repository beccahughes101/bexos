name: Bazel CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  firmware:
    name: Prepare firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-role: firmware
      - name: Validate workflow and scripts
        run: bazel test //tools/ci:workflow_test
      - name: Refresh saved firmware
        run: bash tools/ci/firmware.sh
      - name: Upload firmware for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware
          path: ${{ runner.temp }}/bexos-firmware.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Clean up guest processes
        if: always()
        run: bash tools/ci/cleanup.sh
      - name: Collect diagnostics
        if: always()
        run: python3 tools/ci/collect.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diagnostics-firmware
          path: ${{ runner.temp }}/bexos-ci-diagnostics
          retention-days: 7

  build-test:
    name: Build and test (${{ matrix.architecture }})
    needs: firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        architecture: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-role: build-test-${{ matrix.architecture }}
        id: setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware
          path: ${{ runner.temp }}
      - name: Restore this run's firmware
        run: tar -xf "$RUNNER_TEMP/bexos-firmware.tar"
      - name: Build repository
        env:
          GUEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          bazel build -c opt --config="$GUEST_ARCHITECTURE" //... 2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/build.log"
      - name: Run host tests
        env:
          GUEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          bazel test -c opt --config="$GUEST_ARCHITECTURE" --build_tests_only //... 2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/test.log"
      - name: Check E2E inventory
        if: ${{ !cancelled() && matrix.architecture == 'aarch64' && steps.setup.outcome == 'success' }}
        run: bazel run //testing/e2e/qemu:check_matrix
      - name: Check Rust formatting
        if: ${{ !cancelled() && matrix.architecture == 'aarch64' && steps.setup.outcome == 'success' }}
        run: |
          bazel run @rules_rust//:rustfmt
          git diff --exit-code
      - name: Clean up guest processes
        if: always()
        run: bash tools/ci/cleanup.sh
      - name: Collect diagnostics
        if: always()
        run: python3 tools/ci/collect.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diagnostics-build-test-${{ matrix.architecture }}
          path: ${{ runner.temp }}/bexos-ci-diagnostics
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.suite }})
    needs: firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        suite: [aarch64, x86_64, x86_64_development, firmware_acceptance]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-role: e2e-${{ matrix.suite }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware
          path: ${{ runner.temp }}
      - name: Restore this run's firmware
        run: tar -xf "$RUNNER_TEMP/bexos-firmware.tar"
      - name: Run E2E suite
        env:
          E2E_SUITE: ${{ matrix.suite }}
        run: |
          bazel test --config=e2e --nocache_test_results --test_env=BEXOS_QEMU_LIVE_LOG=1 \
            "//testing/e2e/qemu:$E2E_SUITE" 2>&1 | tee "$RUNNER_TEMP/bexos-ci-logs/e2e.log"
      - name: Clean up guest processes
        if: always()
        run: bash tools/ci/cleanup.sh
      - name: Collect diagnostics
        if: always()
        run: python3 tools/ci/collect.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diagnostics-e2e-${{ matrix.suite }}
          path: ${{ runner.temp }}/bexos-ci-diagnostics
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [firmware, build-test, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          printf 'Firmware: %s\nBuild/tests: %s\nE2E: %s\n' "$FIRMWARE_RESULT" "$BUILD_TEST_RESULT" "$E2E_RESULT"
          [[ "$FIRMWARE_RESULT" == success && "$BUILD_TEST_RESULT" == success && "$E2E_RESULT" == success ]]
