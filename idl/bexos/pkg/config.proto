syntax = "proto3";
package bexos.pkg;

message Config {
  repeated Repository repositories = 1;
  repeated Consumer consumers = 2;
  repeated ArtifactMapping mappings = 3;
  uint64 max_cache_bytes = 4;
  uint64 max_payload_bytes = 5;
  uint32 max_inflight = 6;
  uint32 max_waiters = 7;
  uint64 connect_timeout_ms = 8;
  uint64 request_timeout_ms = 9;
}
message Repository {
  string registry_host = 1;
  string repository = 2;
  bytes trusted_root = 3;
  repeated string token_origins = 4;
  repeated string redirect_origins = 5;
  repeated bytes tls_roots_der = 6;
}
message Consumer {
  string package_id = 1;
  repeated uint32 artifact_kinds = 2;
  repeated string repositories = 3;
}
message ArtifactMapping {
  string name = 1;
  string registry_host = 2;
  string repository = 3;
  string tag = 4;
  uint32 kind = 5;
  HardwareSelector hardware = 6;
  uint32 priority = 7;
}

// Optional fields are presence-sensitive: an omitted value is a wildcard.
// Values are bounded by pkg_config before a mapping can participate.
message HardwareSelector {
  optional uint32 pci_segment = 1;
  optional uint32 pci_bus = 2;
  optional uint32 pci_device = 3;
  optional uint32 pci_function = 4;
  optional uint32 pci_vendor_id = 5;
  optional uint32 pci_device_id = 6;
  optional uint32 pci_class = 7;
  optional uint32 pci_subclass = 8;
  optional uint32 pci_prog_if = 9;
}
