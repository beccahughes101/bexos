syntax = "proto3";

package bexos.platform;

import "idl/bexos/app/manifest.proto";

message AssemblyInputBundle {
  string name = 1;
  repeated AssemblyPackage packages = 2;
}

message AssemblyPackage {
  string label = 1;
  string package_id = 2;
  AssemblyPackagePlacement placement = 3;
  string manifest = 4;
  string archive = 5;
  repeated AssemblyPackageEntry entries = 6;
}

enum AssemblyPackagePlacement {
  ASSEMBLY_PACKAGE_PLACEMENT_UNSPECIFIED = 0;
  BOOTFS = 1;
  SYSTEM_IMAGE = 2;
}

message AssemblyPackageEntry {
  string path = 1;
  string source = 2;
  bool executable = 3;
}

message ProductDefinition {
  string product_name = 1;
  string board = 2;
  string platform_config = 3;
  repeated string bundles = 4;
  repeated ComponentConfigOverride component_config_values = 5;
}

message ComponentConfigOverride {
  string package_id = 1;
  repeated ComponentConfigAssignment values = 2;
  repeated string locked_fields = 3;
}

message ComponentConfigAssignment {
  string name = 1;
  bexos.app.ComponentConfigValue value = 2;
}

message AssemblyManifest {
  string product_name = 1;
  string board = 2;
  string platform_config = 3;
  repeated AssembledPackage packages = 4;
}

message AssembledPackage {
  string package_id = 1;
  string label = 2;
  AssemblyPackagePlacement placement = 3;
  string config_path = 4;
}

// Compiled companion to component.bexconfig; source remains product prototxt.
message ComponentConfigPolicy {
  uint64 schema_fingerprint = 1;
  repeated string locked_fields = 2;
}
