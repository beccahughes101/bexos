syntax = "proto3";

package bexos.platform;

message PlatformConfig {
  PlatformMetadata metadata = 1;
  RunnerPolicy runner_policy = 2;
  TeePolicy tee_policy = 3;
  DriverPolicy driver_policy = 4;
  UpdatePolicy update_policy = 5;
  AppLifecyclePolicy app_lifecycle_policy = 6;
  repeated InterfaceDefault interface_defaults = 7;
  NetworkPolicy network_policy = 8;
}

// Authoritative RFC 68 boot topology. Runtime mutations are intentionally
// absent from this message and therefore disappear after reboot.
message NetworkPolicy {
  repeated NetworkIsolationGroup isolation_groups = 1;
  repeated NetworkDomain domains = 2;
  repeated NetworkVirtualPort virtual_ports = 3;
  repeated NetworkRoute routes = 4;
  repeated NetworkDnsUpstream dns_upstreams = 5;
  repeated NetworkResourceTemplate resource_templates = 6;
  uint32 max_dynamic_providers = 7;
  repeated NetworkRoutedInterface routed_interfaces = 8;
  repeated NetworkSwitchRoute switch_routes = 9;
  NetworkFirewallPolicy firewall = 10;
  NetworkNatPolicy nat = 11;
}

message NetworkRoutedInterface {
  uint64 interface_id = 1;
  uint64 physical_interface = 2;
  uint64 virtual_port = 3;
  uint32 table_id = 4;
  uint32 bridge_domain = 5;
  uint32 vlan_id = 6;
  bytes mac = 7;
  uint32 mtu = 8;
  repeated NetworkIpPrefix addresses = 9;
  uint32 security_zone = 10;
  bool routing_enabled = 11;
}

message NetworkSwitchRoute {
  uint32 table_id = 1;
  NetworkIpPrefix destination = 2;
  bytes gateway = 3;
  uint64 interface_id = 4;
  uint32 metric = 5;
}

message NetworkExtensionArtifact {
  string registry_host = 1;
  string repository = 2;
  string tag = 3;
  bytes expected_digest = 4;
  string media_type = 5;
  string abi = 6;
}

message NetworkFirewallRule {
  string source_zone = 1;
  string destination_zone = 2;
  string direction = 3;
  NetworkIpPrefix source = 4;
  NetworkIpPrefix destination = 5;
  uint32 protocol = 6;
  uint32 source_port_start = 7;
  uint32 source_port_end = 8;
  uint32 destination_port_start = 9;
  uint32 destination_port_end = 10;
  uint32 icmp_type = 11;
  uint32 icmp_code = 12;
  string connection_state = 13;
  bool allow = 14;
}

message NetworkFirewallPolicy {
  repeated NetworkFirewallRule rules = 1;
  NetworkExtensionArtifact desired_artifact = 2;
}

message NetworkNatPortForward {
  bytes external_address = 1;
  uint32 external_port = 2;
  bytes internal_address = 3;
  uint32 internal_port = 4;
  uint32 protocol = 5;
}

message NetworkNatPolicy {
  bool enabled = 1;
  repeated bytes external_ipv4_pool = 2;
  uint32 ephemeral_port_start = 3;
  uint32 ephemeral_port_end = 4;
  repeated NetworkNatPortForward port_forwards = 5;
  NetworkIpPrefix nptv6_internal = 6;
  NetworkIpPrefix nptv6_external = 7;
  NetworkExtensionArtifact desired_artifact = 8;
}

message NetworkIsolationGroup {
  string name = 1;
  string networkd_package = 2;
  string networkd_process = 3;
  string netstackd_package = 4;
  string netstackd_process = 5;
  string resource_template = 6;
  repeated uint32 table_ids = 7;
}

message NetworkDomain {
  string name = 1;
  string isolation_group = 2;
  uint32 table_id = 3;
  bool system_default = 4;
  repeated string authorized_packages = 5;
}

message NetworkResourceTemplate {
  string name = 1;
  uint32 max_instances = 2;
  uint32 cpu_weight = 3;
  uint64 memory_high_bytes = 4;
}

message NetworkVirtualPort {
  uint64 port_id = 1;
  string isolation_group = 2;
  uint32 table_id = 3;
  string physical_selector = 4;
  bytes source_mac = 5;
  uint32 vlan_id = 6;
  bool tagged = 7;
  uint32 rx_queue_depth = 8;
  uint32 tx_queue_depth = 9;
}

message NetworkIpPrefix {
  bytes address = 1;
  uint32 prefix_len = 2;
}

message NetworkRoute {
  string isolation_group = 1;
  uint32 table_id = 2;
  NetworkIpPrefix destination = 3;
  bytes gateway = 4;
  uint64 interface_id = 5;
  uint32 metric = 6;
}

enum NetworkDnsTransport {
  NETWORK_DNS_TRANSPORT_UNSPECIFIED = 0;
  NETWORK_DNS_UDP53 = 1;
  NETWORK_DNS_DOT = 2;
  NETWORK_DNS_DOH = 3;
}

message NetworkDnsUpstream {
  string isolation_group = 1;
  uint32 table_id = 2;
  string provider = 3;
  string domain_suffix = 4;
  bytes bootstrap_address = 5;
  uint32 port = 6;
  NetworkDnsTransport transport = 7;
  string tls_server_name = 8;
  string doh_path = 9;
  uint32 priority = 10;
}

message PlatformMetadata {
  string target_board = 1;
  string platform_profile = 2;
  uint32 min_platform_version = 3;
  Architecture architecture = 4;
}

enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;
  ARCH_AARCH64 = 1;
  ARCH_RISCV64 = 2;
  ARCH_X86_64 = 3;
}

message RunnerPolicy {
  RunnerTier default_tier = 1;
  bool allow_microvm_runner = 2;
  MicrovmConstraints microvm_constraints = 3;
  bool allow_native_elf_runner = 4;
  repeated NativeRunnerGrant native_elf_runner_allowlist = 5;
  repeated RealtimeSchedulingGrant realtime_scheduling_allowlist = 6;
  bool allow_starnix_runner = 7;
}

enum RunnerTier {
  RUNNER_TIER_UNSPECIFIED = 0;
  TIER_1_WASM = 1;
  TIER_2_MICROVM = 2;
  TIER_0_PLATFORM_ELF = 3;
}

message MicrovmConstraints {
  uint32 max_vram_allocation_mb = 1;
  bool allow_network_bridge = 2;
  bool allow_pci_passthrough = 3;
}

message NativeRunnerGrant {
  string package_id = 1;
  string expected_signer = 2;
}

message RealtimeSchedulingGrant {
  string package_id = 1;
  string expected_signer = 2;
}

message TeePolicy {
  bool enforce_secure_boot = 1;
  bool rpmb_anti_rollback = 2;
  string orchestrator_verification = 3;
  repeated string allowed_trusted_apps = 4;
  SecureStorageBackend secure_storage_backend = 5;
  bool require_secure_persistent_keys = 6;
  // Permit the resident x86 recovery owner to authenticate a newer committed
  // firmware measurement instead of the installation's pinned bootstrap hash.
  bool allow_authenticated_firmware_selection = 7;
}

enum SecureStorageBackend {
  SECURE_STORAGE_BACKEND_UNSPECIFIED = 0;
  HARDWARE_RPMB = 1;
  QEMU_EMULATED_RPMB = 2;
}

message DriverPolicy {
  DriverUnmatchedAction default_unmatched_action = 1;
  repeated DriverGrant tier_1_allowlist = 2;
  Tier2DriverRules tier_2_rules = 3;
}

enum DriverUnmatchedAction {
  DRIVER_UNMATCHED_ACTION_UNSPECIFIED = 0;
  REJECT_AND_ISOLATE = 1;
}

message DriverGrant {
  string package_id = 1;
  string expected_signer = 2;
}

message Tier2DriverRules {
  bool enforce_strict_iommu = 1;
  bool allow_raw_mmio = 2;
  uint32 max_dma_bandwidth_mbps = 3;
}

message UpdatePolicy {
  string metadata_base_url = 1;
  string targets_base_url = 2;
  repeated UpdateRootKey trusted_root_keys = 3;
  bytes trusted_root_metadata = 4;
  string app_target_prefix = 5;
  string kernel_target_name = 6;
  string tee_target_name = 7;
  uint64 max_metadata_bytes = 8;
  uint64 max_target_bytes = 9;
  UpdateApplyPolicy default_apply_policy = 10;
}

message UpdateRootKey {
  string key_id = 1;
  string public_key = 2;
}

enum UpdateApplyPolicy {
  UPDATE_APPLY_POLICY_UNSPECIFIED = 0;
  CHECK_ONLY = 1;
  STAGE_ONLY = 2;
  APPLY_IMMEDIATELY = 3;
}

message AppLifecyclePolicy {
  uint64 probation_window_seconds = 1;
  uint64 crash_window_seconds = 2;
  uint32 crash_threshold = 3;
  uint64 restart_delay_seconds = 4;
}

message InterfaceDefault {
  string interface_name = 1;
  string package_name = 2;
  string process_name = 3;
}
